    button, .project-card, .day-cell, summary, .pill.clickable { cursor: pointer; }
    .num,.date { font-family: "Courier New", monospace; }

      background: rgba(15,15,19,.92); border-bottom: 1px solid var(--border); backdrop-filter: blur(14px);

    .brand h1 { margin: 0; color: var(--accent); font-size: 24px; line-height: 1; }
    .brand small { color: var(--muted); font-size: 12px; }
    .day-status { text-align: center; color: var(--muted); }
    .save-badge { justify-self: end; opacity: 0; color: var(--accent2); transition: opacity .25s; }

      position: sticky; top: 60px; z-index: 25;
      display: flex; gap: 18px; overflow-x: auto; white-space: nowrap;
      padding: 0 clamp(14px, 4vw, 34px);
      background: rgba(15,15,19,.92); border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 0 0 auto; border: 0; border-bottom: 2px solid transparent;
      background: transparent; color: var(--muted); padding: 13px 0 11px;

    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    main { max-width: 960px; margin: 0 auto; padding: 108px 24px 56px; }
    .view { animation: fade .15s ease; }

    .card,.panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0,0,0,.4); padding: 16px;
      transition: border-color .15s, transform .15s, box-shadow .15s;

    .card:hover,.project-card:hover { border-color: rgba(201,169,110,.4); transform: translateY(-1px); }
    .gold-glow { box-shadow: 0 0 0 1px rgba(201,169,110,.25), 0 0 28px rgba(201,169,110,.10); }
    .grid { display: grid; gap: 16px; }
    .g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .btn {
      border: 1px solid var(--accent); background: transparent; color: var(--accent);
      border-radius: 5px; padding: 7px 10px; transition: background .15s, color .15s, opacity .15s;
    }
    .btn:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.danger { border-color: #c47b7b; color: #c47b7b; }
    input,textarea,select {
      width: 100%; background: var(--hi); border: 1px solid var(--border); color: var(--text);
      border-radius: 5px; padding: 8px 9px; outline: none;
    }
    textarea { resize: vertical; min-height: 82px; }
    input:focus,textarea:focus,select:focus { border-color: var(--accent); }
    .field { display: grid; gap: 5px; }
    .field label { color: var(--muted); font-size: .84rem; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--accent); border-radius: 3px; width: 0; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
      background: var(--hi); border: 1px solid var(--border); border-radius: 12px;
      color: var(--muted); font-size: .82rem;
    }
    .pill.good { color: var(--success); border-color: rgba(114,178,136,.45); }
    .tag { color: var(--accent); }
    .check { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; }
    .check input { display: none; }
    .check .box {
      width: 16px; height: 16px; flex: 0 0 auto; display: inline-grid; place-items: center;
      background: var(--hi); border: 1px solid var(--border); border-radius: 2px;
    }

    .check input:checked + .box:after { content: "✓"; color: var(--accent); font-weight: 800; font-size: .86rem; }
    .checks { display: flex; gap: 12px; flex-wrap: wrap; }
    .quote { text-align: center; color: var(--accent); font-style: italic; font-size: 1.28rem; }
    .project-card { min-height: 132px; }
    .stage-row { position: relative; display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin: 18px 0; }
    .stage-line { position: absolute; left: 7%; right: 7%; top: 17px; height: 2px; background: var(--border); }
    .stage-line span { display: block; height: 100%; background: var(--accent); }
    .stage-node {
      position: relative; z-index: 2; width: 34px; height: 34px; margin: auto; border-radius: 50%;
      border: 1px solid var(--dim); color: var(--dim); background: var(--surface); display: grid; place-items: center;

    .book-dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); }
    .week-block { overflow-x: auto; }

    .assignment-table th { color: var(--muted); font-size: .8rem; font-weight: 500; text-align: left; }
    .calendar-month h3 { color: var(--accent); }
    .calendar { display: grid; grid-template-columns: repeat(7,1fr); gap: 7px; }
    .dow { text-align: center; color: var(--dim); font-size: .76rem; }
    .day-cell {

    .day-cell.done { background: rgba(201,169,110,.16); border-color: rgba(201,169,110,.55); }
    .day-cell.today { box-shadow: 0 0 0 2px rgba(201,169,110,.55); }
    .day-cell.off { opacity: .22; cursor: not-allowed; }
    .day-cell.future { background: #181824; }
    .emoji { font-size: 1.65rem; }
    .burst { position: fixed; z-index: 60; pointer-events: none; animation: burst 900ms ease forwards; }
    @keyframes burst { to { opacity: 0; transform: translateY(-66px); } }
    .milestone { position: fixed; left: 50%; top: 96px; transform: translateX(-50%); z-index: 70; background: var(--hi); border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 9px 14px; animation: slide 1800ms ease forwards; }
    @keyframes slide { 0% { opacity: 0; transform: translate(-50%,-12px); } 15%,75% { opacity:1; transform:translate(-50%,0); } 100% { opacity:0; transform:translate(-50%,-12px); } }
    .saved-float { position: fixed; right: 18px; top: 72px; background: var(--hi); color: var(--accent2); border: 1px solid rgba(126,184,164,.4); border-radius: 999px; padding: 7px 11px; opacity: 0; transition: opacity .25s; z-index: 80; }
    .saved-float.show { opacity: 1; }
    .hidden { display: none !important; }
    .trunc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tools { display:flex; gap:8px; justify-content:flex-end; margin-bottom:14px; }
    @media (max-width: 760px) {
      .app-header { grid-template-columns: 1fr; height: auto; align-items: start; }
      .day-status { text-align: left; }
      .save-badge { justify-self: start; }
      .tabs { top: 104px; }
      main { padding-top: 156px; padding-inline: 14px; }
      .g2,.g3,.form-grid { grid-template-columns: 1fr; }
      .week-head { grid-template-columns: 1fr; }
      .calendar { grid-template-columns: repeat(7, minmax(42px,1fr)); }
      .day-cell { min-height: 64px; }
    }
    @media print {
      body { background: white; color: black; }
      .app-header,.tabs,.tools,.btn { display: none !important; }
      main { max-width: none; padding: 0; }
      .card,.panel { background: white; color: black; border: 1px solid #999; box-shadow: none; }
      .view:not([data-active-tab="0"]) { display: none; }
      .progress span { background: #333; }
    }
  </style>
</head>

    const dateRange = (start = START, end = END) => {
      const out = [], current = asDate(start), last = asDate(end);
      while (current <= last) { out.push(current.toISOString().slice(0,10)); current.setDate(current.getDate() + 1); }
      return out;

    function deepMerge(base, saved) {
      if (Array.isArray(base)) {
        if (!Array.isArray(saved)) return structuredClone(base);
        return saved.map((item, index) => {
          if (base[index] && typeof base[index] === "object" && !Array.isArray(base[index])) return deepMerge(base[index], item);
          return item;
        });
      }
      if (base && typeof base === "object") {
        const out = structuredClone(base);
        if (saved && typeof saved === "object") {
          Object.keys(saved).forEach(key => {
            out[key] = key in base ? deepMerge(base[key], saved[key]) : saved[key];
          });
        }
        return out;
      }
      return saved ?? base;
    }

      const defaults = normalizeDefaults(DEFAULTS);

      for (let i = 0; i < parts.length - 1; i++) {

    function input(path, value, type = "text", extra = "") {
      return `<input data-path="${path}" type="${type}" value="${escapeHtml(value ?? "")}" ${extra}>`;
    }
    function textarea(path, value, extra = "") {
      return `<textarea data-path="${path}" ${extra}>${escapeHtml(value ?? "")}</textarea>`;
    }
    function select(path, value, options) {
      return `<select data-path="${path}">${options.map(option => `<option value="${escapeHtml(option)}"${option === value ? " selected" : ""}>${escapeHtml(option)}</option>`).join("")}</select>`;
    }
    function check(path, label, checked, cls = "") {
      return `<label class="check ${cls}"><input data-path="${path}" type="checkbox" ${checked ? "checked" : ""}><span class="box"></span><span>${label}</span></label>`;
    }
    function summerStats() {
      const t = todayStr();
      const elapsed = t < START ? 0 : t > END ? TOTAL_DAYS : daysBetween(START, t) + 1;
      return { elapsed, remaining: Math.max(0, TOTAL_DAYS - elapsed), percent: clamp((elapsed / TOTAL_DAYS) * 100) };
    }
    function streakFromDates(dates) {
      const set = new Set(dates);
      const all = dateRange();
      let longest = 0, run = 0;
      all.forEach(day => {
        if (set.has(day)) { run++; longest = Math.max(longest, run); } else run = 0;
      });
      let current = 0;
      const today = todayStr();
      const idx = all.indexOf(today);
      for (let i = idx >= 0 ? idx : all.length - 1; i >= 0; i--) {
        if (set.has(all[i])) current++; else break;
      }
      return { current, longest };
    }
    function pianoStreak() {
      return streakFromDates(Object.keys(state.piano.practiced).filter(day => state.piano.practiced[day]));
    }
    function readingStreak() {
      return streakFromDates(state.reading.log.map(entry => entry.date));
    }
    function trackCompletion(track) {
      return clamp((track.stages.filter(stage => stage === "✓").length / 7) * 100);
    }
    function trackDone(track) {
      return track.stages.every(stage => stage === "✓");
    }
    function epOverall() {
      return clamp(state.ep.tracks.reduce((sum, track) => sum + trackCompletion(track), 0) / state.ep.tracks.length);
    }
    function classMetrics() {
      const allWeeks = [...state.orchestration.weeks, ...state.orchestration.extraWeeks];
      const assignments = allWeeks.flatMap(week => week.assignments);
      return {
        emailed: assignments.filter(assignment => assignment.emailed).length,
        logged: assignments.filter(assignment => assignment.desc.trim() || assignment.due || assignment.notes.trim()).length
      };
    }

      $("dayStatus").textContent = `Day ${stats.elapsed} of ${TOTAL_DAYS}  ·  ${stats.remaining} days remaining`;
    }

    function renderEP() {

    function renderTrackCard(track, index) {

        <div class="row">
          <div style="flex:1">${input(`ep.tracks.${index}.name`, track.name)}</div>

    function emojiFor(day) {
      let seed = 0;

    }

          return `<div class="day-cell ${valid ? "" : "off"} ${practiced ? "done" : ""} ${day === todayStr() ? "today" : ""} ${day > todayStr() ? "future" : ""}" ${valid ? `data-action="toggle-practice" data-day="${day}"` : ""}>

        }).join("")}
      </div></section>`;
    }

          <div class="grid">${state.future.weeklyHours.map((week, index) => `<div class="card">
            <div class="row"><strong>Week ${week.week}</strong><span class="date muted">${week.period}</span></div>
            <div class="form-grid"><div class="field"><label>Hours</label>${input(`future.weeklyHours.${index}.hours`, week.hours ?? "", "number", 'min="0"')}</div><div class="field"><label>Notes</label>${input(`future.weeklyHours.${index}.notes`, week.notes)}</div></div>
          </div>`).join("")}</div>
          <p class="num">Total hours logged: ${totalHours}</p>
        </section>
        <section class="panel"><h2>Research — VR & Amblyopia</h2>
          <div class="field"><label>Status</label>${select("future.vrStatus", state.future.vrStatus, ["○ Not Started","→ Background Reading","🔬 Actively Researching","✍ Writing Up"])}</div>
          <div class="checks">
            ${check("future.vrChecklist.lit", "Read background literature on amblyopia treatment", state.future.vrChecklist.lit)}
            ${check("future.vrChecklist.research", "Review VR therapy research", state.future.vrChecklist.research)}
            ${check("future.vrChecklist.self", "Explore self-treatment approaches", state.future.vrChecklist.self)}
            ${check("future.vrChecklist.consult", "Talk to relevant people / consult professionals", state.future.vrChecklist.consult)}
          </div>
          ${textarea("future.vrNotes", state.future.vrNotes, 'rows="5"')}
        </section>
        <section class="panel"><h2>Blog / Podcast (?)</h2>
          <div class="field"><label>Status</label>${select("future.blogStatus", state.future.blogStatus, ["💭 Just an idea","🧭 Planning","🎙 In Progress"])}</div>
          ${textarea("future.blogNotes", state.future.blogNotes, 'rows="5"')}
        </section>
        <section class="panel"><h2>Open Notes</h2>${textarea("future.openNotes", state.future.openNotes, 'rows="8"')}<p class="muted" style="text-align:right">${state.future.openNotes.length} characters</p></section>
      </div>`;
    }

    function cycle(value, options) {
      return options[(options.indexOf(value) + 1) % options.length];
    }
    function assignmentList(extra, weekIndex) {
      return extra === "true" || extra === true ? state.orchestration.extraWeeks[weekIndex].assignments : state.orchestration.weeks[weekIndex].assignments;
    }
    function showBurst(x, y) {
      ["🎉","✨","🌟"].forEach((emoji, index) => {
        const span = document.createElement("span");
        span.className = "burst";
        span.textContent = emoji;
        span.style.left = `${x + index * 18}px`;
        span.style.top = `${y}px`;
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 950);
      });
    }
    function showMilestone(streak) {
      const div = document.createElement("div");
      div.className = "milestone";
      div.textContent = `🎉 ${streak}-day streak!`;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 1900);
    }

    document.addEventListener("click", event => {
      const tab = event.target.closest("[data-tab]");
      if (tab) {
        state.activeTab = Number(tab.dataset.tab);
        save(false);
        render();
        return;
      }
      const el = event.target.closest("[data-action]");
      if (!el) return;
      const action = el.dataset.action;
      if (action === "cycle-ep-stage") {
        const track = state.ep.tracks[Number(el.dataset.track)];
        const stageIndex = Number(el.dataset.stage);
        track.stages[stageIndex] = cycle(track.stages[stageIndex], EP_STAGE_VALUES);
      }
      if (action === "toggle-track") state.ep.tracks[Number(el.dataset.index)].collapsed = !state.ep.tracks[Number(el.dataset.index)].collapsed;
      if (action === "add-book") state.reading.books.push({ id: state.reading.nextBookId++, title:"", author:"", year:"", pages:0, read:0, status:"📌 Want to Read", notes:"", start:null, end:null, color:"#c9a96e" });
      if (action === "delete-book" && confirm("Delete this book?")) state.reading.books.splice(Number(el.dataset.index), 1);
      if (action === "book-color") state.reading.books[Number(el.dataset.index)].color = el.dataset.color;
      if (action === "cycle-book-status") {
        const book = state.reading.books[Number(el.dataset.index)];
        book.status = cycle(book.status, ["📌 Want to Read","📖 Reading","✅ Completed"]);
        if (book.status === "📖 Reading" && !book.start) book.start = todayStr();
        if (book.status === "✅ Completed") book.end = todayStr();
      }
      if (action === "toggle-reading-log") state.reading.todayOpen = !state.reading.todayOpen;
      if (action === "save-reading-log") {
        const day = todayStr();
        const existing = state.reading.log.find(entry => entry.date === day);
        const bookIds = state.reading.books.filter(book => getPath(`reading.logToday.book.${book.id}`)).map(book => book.id);
        const notes = getPath("reading.logToday.notes") || "";
        if (existing) { existing.bookIds = bookIds; existing.notes = notes; }
        else state.reading.log.push({ id: Date.now(), date: day, bookIds, notes });
        state.reading.todayOpen = false;
      }
      if (action === "save-work") {
        const entry = state.work.entries[todayStr()];
        if (entry) entry.savedAt = new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
      }
      if (action === "toggle-work-expand") {
        const entry = state.work.entries[el.dataset.day];
        if (entry) entry.expanded = !entry.expanded;
      }
      if (action === "add-assignment") assignmentList(el.dataset.extra, Number(el.dataset.week)).push(assignmentTemplate());
      if (action === "delete-assignment" && confirm("Delete this assignment row?")) assignmentList(el.dataset.extra, Number(el.dataset.week)).splice(Number(el.dataset.assignment), 1);
      if (action === "add-extra-session") state.orchestration.extraWeeks.push(weekTemplate(todayStr()));
      if (action === "toggle-practice") {
        const day = el.dataset.day;
        state.piano.practiced[day] = !state.piano.practiced[day];
        const current = pianoStreak().current;
        if (state.piano.practiced[day]) showBurst(event.clientX, event.clientY);
        if ([7,14,30,50].includes(current) && state.piano.lastMilestone !== current) {
          state.piano.lastMilestone = current;
          showMilestone(current);
        }
      }
      if (action === "add-piece") state.composition.pieces.push({ id: state.composition.nextPieceId++, title:"New piece", instrumentation:"", status:"○ Sketching", target:"", tasks:[], diary:"", collapsed:false });
      if (action === "toggle-piece") state.composition.pieces[Number(el.dataset.index)].collapsed = !state.composition.pieces[Number(el.dataset.index)].collapsed;
      if (action === "add-task") state.composition.pieces[Number(el.dataset.index)].tasks.push({ text:"", done:false });
      if (action === "delete-task") state.composition.pieces[Number(el.dataset.piece)].tasks.splice(Number(el.dataset.task), 1);
      if (action === "delete-piece" && confirm("Delete this piece?")) state.composition.pieces.splice(Number(el.dataset.index), 1);
      if (action === "add-study-work") state.study.works.push({ id: state.study.nextWorkId++, composer:"other", title:"New work", focus:"", status:"○ Not Started", date:null, notes:"" });
      if (action === "add-explore") state.future.explore.push({ id: state.future.exploreNextId++, text:"", done:false });
      save();
      render();
    });

    document.addEventListener("input", event => {
      const path = event.target.dataset.path;
      if (!path) return;
      const value = event.target.type === "number" ? (event.target.value === "" ? null : Number(event.target.value)) : event.target.value;
      setPath(path, value);
      debouncedSave(false);
    });
    document.addEventListener("change", event => {
      const path = event.target.dataset.path;
      if (!path) return;
      const value = event.target.type === "checkbox" ? event.target.checked : event.target.type === "number" ? (event.target.value === "" ? null : Number(event.target.value)) : event.target.value;
      setPath(path, value);
      if (path.endsWith(".clocked") && value) showBurst(event.clientX || window.innerWidth / 2, event.clientY || 120);
      if (path.includes("study.works") && path.endsWith(".status") && value === "✅ Complete") {
        const index = Number(path.split(".")[2]);
        state.study.works[index].date = todayStr();
      }
      save();
      render();
    });
    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && /^[1-9]$/.test(event.key)) {
        state.activeTab = Number(event.key) - 1;
        save(false);
        render();
      }
    });
    $("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "summer2026.json";
      a.click();
      URL.revokeObjectURL(url);
    });
    $("importFile").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed.ep || !parsed.reading || !parsed.orchestration) throw new Error("Invalid summer2026 data");
          state = deepMerge(normalizeDefaults(DEFAULTS), parsed);
          save();
          render();
        } catch (error) {
          alert(`Import failed: ${error.message}`);
        }
      };
      reader.readAsText(file);
    });
    $("resetBtn").addEventListener("click", () => {
      if (!confirm("Reset all saved data?")) return;
      if (!confirm("Confirm reset to defaults?")) return;
      state = normalizeDefaults(DEFAULTS);
      save();
      render();
    });

    loadState();
    render();
  </script>
</body>
</html>
