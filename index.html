<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f13;--surface:#1a1a24;--surface-hi:#22222f;--accent:#c9a96e;--accent2:#7eb8a4;--accent3:#b08dd1;--text:#e8e6e0;--text-muted:#9896a0;--text-dim:#5a5868;--border:#2e2d3a;--success:#72b288;--danger:#c47b7b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top left,rgba(201,169,110,.12),transparent 32rem),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}h1,h2,h3,.quote{font-family:"Playfair Display",Georgia,serif;letter-spacing:.01em}h1,h2,h3,p{margin-top:0}.num,.date{font-family:"Courier New",monospace}.top{position:fixed;inset:0 0 auto;z-index:20;background:rgba(15,15,19,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.head{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:12px clamp(16px,4vw,44px)}.brand h1{margin:0;color:var(--accent);font-size:2.2rem;line-height:1}.brand small{color:var(--text-muted)}.dayline{text-align:center;color:var(--text-muted)}.saved{text-align:right;color:var(--accent2);opacity:0;transition:opacity .25s}.saved.show{opacity:1}.tabs{display:flex;gap:20px;overflow-x:auto;padding:0 clamp(16px,4vw,44px);border-top:1px solid rgba(255,255,255,.03)}.tab{flex:0 0 auto;background:transparent;border:0;color:var(--text-muted);padding:13px 2px 12px;position:relative;transition:color .15s}.tab.active{color:var(--text)}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:2px}.wrap{max-width:1220px;margin:0 auto;padding:132px clamp(14px,3vw,28px) 56px}.view{animation:fade .15s ease}@keyframes fade{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}.card,.panel{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,.4);padding:18px}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--text-muted)}.dim{color:var(--text-dim)}.btn{border:1px solid var(--border);background:var(--surface-hi);color:var(--text);border-radius:5px;padding:8px 11px;transition:border-color .15s,background .15s}.btn:hover{border-color:var(--accent);background:#282838}.btn.danger{color:var(--danger)}input,textarea,select{width:100%;background:#111118;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:9px 10px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:82px;resize:vertical}.field{display:grid;gap:6px}.field label{font-size:.82rem;color:var(--text-muted)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.bar{height:6px;background:#101016;border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.03)}.fill{height:100%;width:0;background:var(--accent);border-radius:99px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:4px 9px;color:var(--text-muted);background:#15151d;font-size:.82rem}.pill.ok{color:var(--success);border-color:rgba(114,178,136,.45)}.pill.gold{color:var(--accent);border-color:rgba(201,169,110,.45)}.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-muted)}.check input{display:none}.box{width:17px;height:17px;border:1px solid var(--border);border-radius:2px;background:#101016;display:inline-grid;place-items:center;flex:0 0 auto}.check input:checked+.box{border-color:var(--accent);background:rgba(201,169,110,.12)}.check input:checked+.box:after{content:"✓";color:var(--accent);font-weight:800;font-size:.9rem}.checks{display:flex;gap:12px;flex-wrap:wrap}.quote{text-align:center;font-style:italic;font-size:1.45rem;color:var(--accent);padding:14px}.quote small{display:block;margin-top:8px;font-family:system-ui;color:var(--text-muted);font-style:normal}.project{cursor:pointer;transition:transform .15s,border-color .15s}.project:hover{transform:translateY(-2px);border-color:var(--accent)}.segments{display:flex;gap:4px}.seg{height:8px;flex:1;background:#101016;border-radius:8px;border:1px solid var(--border)}.seg.on{background:var(--accent)}.seg.teal{background:var(--accent2)}.track.complete{box-shadow:0 0 0 1px rgba(201,169,110,.3),0 0 28px rgba(201,169,110,.13)}.pipeline{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;position:relative;margin:18px 0}.step{height:32px;width:32px;border-radius:50%;border:1px solid var(--border);background:#101016;color:var(--text-muted);display:grid;place-items:center;margin:auto;position:relative;z-index:1}.step.s1{background:rgba(201,169,110,.14);border-color:var(--accent);color:var(--accent)}.step.s2{background:rgba(126,184,164,.18);border-color:var(--accent2);color:var(--accent2)}.step:before{content:attr(data-tip);position:absolute;bottom:39px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#08080d;border:1px solid var(--border);padding:4px 7px;border-radius:5px;font-size:.75rem;color:var(--text);opacity:0;pointer-events:none}.step:hover:before{opacity:1}.stage-line{position:absolute;left:7%;right:7%;top:15px;height:2px;background:var(--border)}.stage-line span{display:block;height:100%;background:var(--accent)}.collapsed .hideable{display:none}.bookdot{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);display:inline-block}.history{max-height:460px;overflow:auto}.truncate{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.practice-month h3{color:var(--accent)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.dow{color:var(--text-dim);font-size:.75rem;text-align:center}.day{min-height:70px;border:1px solid var(--border);border-radius:8px;background:#12121a;padding:6px;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}.day .n{justify-self:start;align-self:start;color:var(--text-dim);font-family:"Courier New",monospace;font-size:.78rem}.day.done{background:linear-gradient(135deg,rgba(201,169,110,.14),rgba(126,184,164,.11));border-color:rgba(201,169,110,.55)}.day.today{border-color:var(--accent);box-shadow:0 0 0 1px rgba(201,169,110,.4)}.day.off{opacity:.22;cursor:not-allowed}.statbar{position:sticky;bottom:10px;z-index:3}.burst{position:fixed;pointer-events:none;z-index:50;animation:float 900ms ease forwards;font-size:1.2rem}@keyframes float{to{transform:translateY(-70px);opacity:0}}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--border);padding:10px;text-align:left}.table th{color:var(--text-muted);font-weight:500}.current-week{background:rgba(201,169,110,.08)}.savedBadge{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--surface-hi);border:1px solid rgba(126,184,164,.5);color:var(--accent2);border-radius:99px;padding:8px 12px;box-shadow:0 2px 16px rgba(0,0,0,.4);opacity:0;transition:opacity .25s}.savedBadge.show{opacity:1}.empty{color:var(--text-muted);font-style:italic}.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}.hidden{display:none!important}@media(max-width:850px){.head{grid-template-columns:1fr;height:auto}.dayline,.saved{text-align:left}.wrap{padding-top:176px}.g2,.g3,.g4,.form{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(7,44px);overflow:auto}.day{min-height:58px}}@media print{body{background:white;color:black}.top,.tools,.tabs{display:none}.wrap{padding:0}.view:not([data-tab="overview"]){display:none}.card,.panel{box-shadow:none;border:1px solid #999;background:white;color:black}.fill{background:#333}.quote{color:black}}
</style>
</head>
<body>
<header class="top">
  <div class="head">
    <div class="brand"><h1>夏 2026</h1><small>Jun 8 – Sep 1</small></div>
    <div id="dayLine" class="dayline num"></div>
    <div id="topSaved" class="saved">saved ✓</div>
  </div>
  <nav id="tabs" class="tabs"></nav>
</header>
<main class="wrap">
  <div class="tools">
    <button class="btn" id="exportBtn">Export JSON</button>
    <label class="btn">Import JSON<input id="importFile" type="file" accept="application/json" hidden></label>
    <button class="btn danger" id="resetBtn">Reset seed</button>
  </div>
  <section id="view" class="view"></section>
</main>
<div id="savedBadge" class="savedBadge">Saved ✓</div>
<script>
const KEY="summer2026_data",START="2026-06-08",END="2026-09-01",TOTAL=85;
const tabs=[["overview","总览"],["ep","EP"],["reading","读书"],["work","工作"],["orch","管弦乐课"],["piano","练琴"],["composition","作曲"],["composer","作曲家"],["future","未来"]];
const quotes=[
["Sound is time given form.","Tōru Takemitsu"],["To write is human, to edit is divine.","Stephen King"],["I believe music should be born out of silence.","Tōru Takemitsu"],["The first draft of anything is shit.","Ernest Hemingway"],["Music is the silence between the notes.","Claude Debussy"],["I have no special talent. I am only passionately curious.","Einstein"],["Write with the door closed, rewrite with the door open.","Stephen King"],["A composer is a person who is forever composing.","Tōru Takemitsu"],["Every note wants to go somewhere.","Ryuichi Sakamoto"],["Simplicity is the final achievement.","Frédéric Chopin"]];
const stageNames=[["想法","Idea"],["设计","Design"],["作曲","Composition"],["录音","Recording"],["编曲","Arrangement"],["混音","Mix"],["母带","Master"]];
const colors={amber:"#c9a96e",teal:"#7eb8a4",lavender:"#b08dd1",rose:"#c47b7b",sage:"#72b288",slate:"#5a5868"};
let state,active=localStorage.getItem("summer2026_active")||"overview",timer;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const date=(s)=>new Date(s+"T00:00:00");
const fmt=s=>date(s).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const daysBetween=(a,b)=>Math.round((date(b)-date(a))/86400000);
function range(a=START,b=END){let out=[],d=date(a),e=date(b);while(d<=e){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out}
function weekdays(){return range().filter(d=>![0,6].includes(date(d).getDay()))}
function weeks(){let w=[],all=weekdays();for(let i=0;i<all.length;i+=5)w.push(all.slice(i,i+5));return w.slice(0,13)}
function pct(n,d){return d?Math.round(n/d*100):0}
function bar(p){return `<div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,p))}%"></div></div>`}
function segs(n,total,cls=""){return `<div class="segments">${Array.from({length:total},(_,i)=>`<span class="seg ${i<n?"on "+cls:""}"></span>`).join("")}</div>`}
function cb(path,label,checked){return `<label class="check"><input data-path="${path}" type="checkbox" ${checked?"checked":""}><span class="box"></span><span>${label}</span></label>`}
function input(path,val,type="text",extra=""){return `<input data-path="${path}" type="${type}" value="${esc(val)}" ${extra}>`}
function ta(path,val,ph=""){return `<textarea data-path="${path}" placeholder="${esc(ph)}">${esc(val)}</textarea>`}
function get(path){return path.split(".").reduce((o,k)=>o?.[k],state)}
function set(path,val){let a=path.split("."),o=state;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a.at(-1)]=val}
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function seedEmoji(s){const e=["🌟","✨","🎹","🌸","🎶","🌈","🍀","💫","🎵","🌙","🦋","🍁","🎀","🌻","🪐"];let n=0;for(const c of s)n+=c.charCodeAt(0);return e[n%e.length]}
function defaultState(){return{
ep:{title:"",concept:"",checks:[false,false,false,false],tracks:["Intro","Track 1","Interlude 1","Track 2","Interlude 2","Track 3","Outro"].map((n,i)=>({id:id(),name:n,collapsed:false,notes:"",stages:[0,0,0,0,0,0,0]}))},
reading:{books:[["Ant Encounters: Interaction Networks and Colony Behavior","Deborah M. Gordon","amber"],["On Writing: A Memoir of the Craft","Stephen King","teal"],["Confronting Silence","Tōru Takemitsu","lavender"]].map(b=>({id:id(),title:b[0],author:b[1],color:b[2],status:0,pages:0,total:"",manual:0,start:"",end:"",notes:""})),logs:{}},
work:{entries:{}},
orch:{notes:"",assignments:Array.from({length:5},(_,i)=>({id:id(),desc:"",due:"",status:0,draft:false,revision:false,final:false,email:false,notes:""}))},
piano:{days:Object.fromEntries(range().map(d=>[d,false])),milestone:0},
composition:{pieces:[{id:id(),title:"well…哎…",inst:"piano, violin, cello, clarinet (Piano Quartet)",goal:"Revise and expand for live recording this summer",status:2,target:"",notes:"",collapsed:false,tasks:["Re-examine overall structure and formal arc","Revise the opening section","Compose / expand the middle section","Draft the ending","Clean notation in notation software","Prepare individual parts for each instrument","Recording session preparation"].map(t=>({id:id(),text:t,done:false}))}]},
composer:{sections:[{name:"吉松隆 Yoshimatsu",accent:"amber",collapsed:false,works:[["昴星団舞曲集 — Pleiades Dances",["odd-meter phrases","melodic landing points"]],["Fuzzy Bird Saxophone Sonata",["harmony","piano texture","groove / rhythm"]],["朱鷺の哀歌 — Elegy for Jōku",["spatial sense","breath","string layering"]],["Piano Concerto \"Memo Flora\" 随意花木",["structural design","harmony","cadenza design","orchestration"]],["Symphony No. 4",["movement contrast","metric modulation","Lydian chromatic","formal structure","orchestration"]]].map(w=>({id:id(),title:w[0],tags:w[1],status:0,doneDate:"",notes:"",collapsed:false}))},{name:"武満徹 Takemitsu",accent:"teal",collapsed:false,works:[["Harmonic Language — General Study",["harmonic vocabulary","aesthetics","philosophy"],"Reference: Confronting Silence (book in Reading tab)"],["Rain Tree Sketch",["short-form thinking","motivic development","title / naming"]],["Distance de fée",["short-form thinking","motivic development","title / naming"]],["Pause Interrompue",["short-form thinking","motivic development","title / naming"]],["Requiem",["early works","string writing","texture"]],["Dorian Horizon",["string ensemble writing","texture"]],["November Steps",["harmony","orchestration","structure"]],["A Flock Descends into the Pentagonal Garden",["philosophical concepts","harmony","structure","late works"]]].map(w=>({id:id(),title:w[0],tags:w[1],status:0,doneDate:"",notes:w[2]||"",collapsed:false}))}]},
future:{careerText:"",career:[{id:id(),text:"game music",done:false},{id:id(),text:"composition grad school",done:false},{id:id(),text:"sound design",done:false}],weekHours:weeks().map((w,i)=>({week:i+1,period:`${w[0].slice(5)}–${w.at(-1).slice(5)}`,hours:"",notes:""})),research:{status:0,notes:"",checks:[false,false,false,false]},blog:{status:0,formats:[false,false,false,false],ideas:[{id:id(),text:"",done:false}],notes:""},openNotes:""}}
}
function load(){try{state=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch{state=defaultState()}save(false)}
function save(flash=true){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem("summer2026_active",active);if(flash){$("topSaved").classList.add("show");$("savedBadge").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>{$("topSaved").classList.remove("show");$("savedBadge").classList.remove("show")},1500)}}
function debounced(){clearTimeout(timer);timer=setTimeout(()=>save(),300)}
function summerStats(){let t=today(),elapsed=t<START?0:t>END?TOTAL:daysBetween(START,t)+1,remain=Math.max(0,TOTAL-elapsed);return{elapsed,remain,p:pct(elapsed,TOTAL)}}
function streak(map){let all=range(),cur=0,long=0,run=0,t=today();for(const d of all){if(map[d]){run++;long=Math.max(long,run)}else run=0}for(let i=all.indexOf(t);i>=0;i--){if(map[all[i]])cur++;else break}return{cur,long}}
function render(){renderTabs();$("dayLine").textContent=`Day ${summerStats().elapsed} of ${TOTAL} · ${summerStats().remain} days remaining`;let html=({overview,ep,reading,work,orch,piano,composition,composer,future})[active]();$("view").dataset.tab=active;$("view").innerHTML=html}
function renderTabs(){$("tabs").innerHTML=tabs.map(t=>`<button class="tab ${active===t[0]?"active":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}
function epTrackDone(t){return t.stages.every(s=>s===2)}function epPct(){return pct(state.ep.tracks.flatMap(t=>t.stages).filter(s=>s===2).length,49)}
function trackBadge(t){let d=t.stages.filter(s=>s===2).length;if(d===7)return"Complete ✓";if(d>=5)return"In Post";if(t.stages[3]===2)return"Recorded";if(d>=1)return"Composing";return"Not Started"}
function readingStreak(){let m={};Object.keys(state.reading.logs).forEach(d=>m[d]=true);return streak(m).cur}
function overview(){let st=summerStats(),q=quotes[daysBetween(START,today())%quotes.length]||quotes[0],books=state.reading.books,wd=weekdays(),workLogged=wd.filter(d=>state.work.entries[d]?.text).length,workFull=wd.filter(d=>{let e=state.work.entries[d];return e?.prof&&e?.cow&&e?.clock}).length,orchDone=state.orch.assignments.filter(a=>a.email).length,ps=streak(state.piano.days),compTasks=state.composition.pieces.flatMap(p=>p.tasks),works=state.composer.sections.flatMap(s=>s.works),y=state.composer.sections[0].works.filter(w=>w.status===4).length,ta=state.composer.sections[1].works.filter(w=>w.status===4).length,open=state.future.career.filter(i=>!i.done).length+state.future.research.checks.filter(x=>!x).length,thisWeek=state.future.weekHours.find(w=>currentWeekPeriod(w.period))?.hours||0;return`
<div class="grid">
<section class="panel"><div class="row"><span class="muted">Summer progress</span><span class="num">${st.p}%</span></div>${bar(st.p)}</section>
<section class="quote">“${q[0]}”<small>— ${q[1]}</small></section>
<section class="grid g3">
${project("ep","🎵","EP Production",`${state.ep.tracks.filter(epTrackDone).length} / 7 tracks completed`,segs(state.ep.tracks.map(t=>t.stages.filter(s=>s===2).length).filter(n=>n===7).length,7),state.ep.title||"Untitled EP")}
${project("reading","📚","Reading",`${books.filter(b=>b.status===2).length} / ${books.length} books completed`,`🔥 ${readingStreak()} day streak`,"")}
${project("work","💼","Work Log",`${workLogged} / ${wd.length} weekdays logged`,`${workFull} days fully checked`,"")}
${project("orch","🎼","Orchestration Course",`${orchDone} / 5 assignments emailed`,segs(orchDone,5),"")}
${project("piano","🎹","Piano Practice",`${Object.values(state.piano.days).filter(Boolean).length} / ${TOTAL} days practiced`,`🔥 ${ps.cur} day streak`,"")}
${project("composition","✍️","Composition",`${state.composition.pieces.length} active pieces, ${compTasks.filter(t=>t.done).length}/${compTasks.length} tasks`,state.composition.pieces.map(p=>p.title).join(", ").slice(0,64),"")}
${project("composer","🎧","Composer Study",`${works.filter(w=>w.status===4).length} / 13 works analyzed`,`Yoshimatsu ${y}/5 · Takemitsu ${ta}/8`,"")}
${project("future","🗺️","Future Workspace",`${thisWeek||0} Workday hours this week`,`${open} open checklist items`,"")}
</section></div>`}
function project(tab,icon,title,metric,extra,sub){return`<article class="card project" data-tab="${tab}"><div class="row"><h3>${icon} ${title}</h3></div><p class="num">${metric}</p><div class="muted">${extra}</div>${sub?`<small class="dim">${esc(sub)}</small>`:""}</article>`}
function ep(){let med=[...state.ep.tracks.flatMap(t=>t.stages)].sort()[24]||0,status=["Not Started","Pre-production","In Production"][med]||"Post-production";if(epPct()===100)status="Done";return`<div class="grid">
<section class="panel"><div class="form"><div class="field"><label>EP Title</label>${input("ep.title",state.ep.title,"text",'placeholder="Untitled EP"')}</div><div><span class="pill gold">${status}</span><p class="num">${epPct()}% complete</p>${bar(epPct())}</div></div><div class="field"><label>Concept / Sonic Direction</label>${ta("ep.concept",state.ep.concept,"Aesthetic, mood, references, themes...")}</div></section>
${state.ep.tracks.map((t,i)=>trackCard(t,i)).join("")}
<section class="panel"><h2>EP Checklist</h2><div class="checks">${["Final track sequence locked","EP artwork / visual concept decided","All tracks mastered","Release-ready"].map((l,i)=>cb(`ep.checks.${i}`,l,state.ep.checks[i])).join("")}</div></section></div>`}
function trackCard(t,i){let d=t.stages.filter(s=>s===2).length;return`<article class="card track ${epTrackDone(t)?"complete":""} ${t.collapsed?"collapsed":""}"><div class="row"><div class="row" style="flex:1"><span class="num">#${i+1}</span>${input(`ep.tracks.${i}.name`,t.name)}<span class="pill ${epTrackDone(t)?"ok":"gold"}">${trackBadge(t)}</span></div><button class="btn" data-act="toggleTrack" data-i="${i}">${t.collapsed?"▼":"▲"}</button></div><div class="hideable"><div class="pipeline"><div class="stage-line"><span style="width:${pct(Math.max(0,d-1),6)}%"></span></div>${stageNames.map((s,j)=>`<button class="step s${t.stages[j]}" data-act="cycleStage" data-i="${i}" data-j="${j}" data-tip="${s[0]} · ${s[1]}">${t.stages[j]===2?"●":t.stages[j]===1?"◑":"○"}</button>`).join("")}</div><details><summary class="muted">Notes</summary>${ta(`ep.tracks.${i}.notes`,t.notes)}</details></div></article>`}
function reading(){let rs=readingStreak(),todayLog=state.reading.logs[today()];return`<div class="grid"><section class="panel"><h2>📖 Reading streak: ${rs} consecutive days ${rs>=3?"🔥":""}</h2><p class="muted">${rs?"Keep the door to the book open.":"Ten quiet minutes counts."}</p></section><section class="grid g2">${state.reading.books.map((b,i)=>book(b,i)).join("")}</section><button class="btn" data-act="addBook">+ Add Book</button><section class="panel"><div class="row"><h2>Daily Reading Log</h2><button class="btn" data-act="toggleTodayLog">${todayLog?"Edit today's entry":"Log Today"}</button></div><div id="todayLog" class="${todayLog?.open?"":"hidden"}"><div class="muted date">${fmt(today())}</div>${ta(`reading.logs.${today()}.text`,todayLog?.text||"","What did you read?")}<div class="checks">${state.reading.books.filter(b=>b.status!==2).map(b=>cb(`reading.logs.${today()}.books.${b.id}`,b.title,todayLog?.books?.[b.id])).join("")}</div></div><h3>History</h3><div class="history grid">${Object.entries(state.reading.logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10).map(([d,l])=>`<div class="card"><b class="date">${d}</b><p class="${l.expanded?"":"truncate"}">${esc(l.text||"")}</p><small class="muted">${Object.keys(l.books||{}).filter(k=>l.books[k]).map(k=>state.reading.books.find(b=>b.id===k)?.title).filter(Boolean).join(", ")}</small><br><button class="btn" data-act="expandLog" data-d="${d}">${l.expanded?"Collapse":"Expand"}</button></div>`).join("")||`<p class="empty">No reading entries yet. One sentence is enough.</p>`}</div></section></div>`}
function book(b,i){let p=b.total?pct(+b.pages,+b.total):+b.manual||0;return`<article class="card"><div class="row"><span class="bookdot" style="background:${colors[b.color]}"></span><select data-path="reading.books.${i}.color">${Object.keys(colors).map(c=>`<option ${b.color===c?"selected":""}>${c}</option>`)}</select><button class="btn danger" data-act="delBook" data-i="${i}">Delete</button></div><div class="field"><label>Title</label>${input(`reading.books.${i}.title`,b.title)}</div><div class="field"><label>Author</label>${input(`reading.books.${i}.author`,b.author)}</div><button class="btn" data-act="cycleBook" data-i="${i}">${["Want to Read","Reading","Completed"][b.status]}</button><div class="form"><div class="field"><label>Pages read</label>${input(`reading.books.${i}.pages`,b.pages,"number")}</div><div class="field"><label>Total pages</label>${input(`reading.books.${i}.total`,b.total,"number")}</div></div>${b.total?bar(p):`<input data-path="reading.books.${i}.manual" type="range" min="0" max="100" value="${p}">`}${bar(p)}<p class="muted">Start ${b.start||"—"} · End ${b.end||"—"}</p><details><summary>Notes</summary>${ta(`reading.books.${i}.notes`,b.notes)}</details></article>`}
function work(){let d=today(),e=state.work.entries[d]||{text:"",prof:false,cow:false,clock:false,saved:""},wd=weekdays(),entries=wd.map(x=>[x,state.work.entries[x]]).filter(x=>x[1]?.text).sort((a,b)=>b[0].localeCompare(a[0])),thisWeek=wd.filter(x=>currentWeekDate(x)),logged=thisWeek.filter(x=>state.work.entries[x]?.text).length,clock=thisWeek.filter(x=>state.work.entries[x]?.clock).length,prof=Object.values(state.work.entries).filter(x=>x.prof).length;return`<div class="grid"><section class="panel"><div class="row"><h2>${fmt(d)}</h2><span class="muted">${e.saved?`Last saved: ${e.saved}`:""}</span></div>${ta(`work.entries.${d}.text`,e.text,"今天做了什么...")}<div class="checks">${cb(`work.entries.${d}.prof`,"📬 Updated professor",e.prof)}${cb(`work.entries.${d}.cow`,"🤝 Checked in with coworker",e.cow)}${cb(`work.entries.${d}.clock`,e.clock?"Great work today!":"🎉 Successfully clocked out!",e.clock)}</div><button class="btn" ${e.text?"":"disabled"} data-act="saveWorkToday">Save Entry</button></section><section class="grid">${entries.map(([dd,x])=>`<article class="card"><div class="row"><b>${dd}</b><span class="muted">${fmt(dd).split(",")[0]}</span></div><p class="truncate">${esc(x.text)}</p><div class="checks"><span class="pill ${x.prof?"ok":""}">Professor</span><span class="pill ${x.cow?"ok":""}">Coworker</span><span class="pill ${x.clock?"ok":""}">Clocked out</span></div><button class="btn" data-act="editWork" data-d="${dd}">Edit</button></article>`).join("")||`<p class="empty">No weekday entries yet. Start with today's one paragraph.</p>`}</section><section class="panel statbar"><span>This week: ${logged}/${thisWeek.length} days logged</span> · <span>🎉 Clocked out clean: ${clock}</span> · <span>Total professor updates: ${prof}</span></section></div>`}
function orch(){let done=state.orch.assignments.filter(a=>a.email).length;return`<div class="grid"><section class="panel"><div class="row"><h2>Assignments submitted: ${done} / 5</h2></div>${segs(done,5,"teal")}</section><section class="grid g2">${state.orch.assignments.map((a,i)=>`<article class="card"><h3>作业 ${i+1}</h3><div class="field"><label>Description</label>${input(`orch.assignments.${i}.desc`,a.desc,"text",'placeholder="Woodwind chorale"')}</div><div class="field"><label>Due date</label>${input(`orch.assignments.${i}.due` ,a.due,"date")}</div><button class="btn" data-act="cycleAssign" data-i="${i}">${["Not Started","In Progress","Done"][a.status]}</button><div class="checks">${cb(`orch.assignments.${i}.draft`,"Draft",a.draft)}${cb(`orch.assignments.${i}.revision`,"Revision",a.revision)}${cb(`orch.assignments.${i}.final`,"Final copy",a.final)}${cb(`orch.assignments.${i}.email`,"✉️ Email sent to teacher",a.email)}</div><details><summary>Notes/feedback</summary>${ta(`orch.assignments.${i}.notes`,a.notes)}</details></article>`).join("")}</section><section class="panel"><h2>Course Notes</h2>${ta("orch.notes",state.orch.notes,"General notes — concepts learned, teacher feedback, ideas")}</section></div>`}
function piano(){let ps=streak(state.piano.days),done=Object.values(state.piano.days).filter(Boolean).length,msg=ps.cur===0?"Time to sit down at the keys 🎹":ps.cur<=3?"Great start! Keep it going ✨":ps.cur<=7?"Building momentum 🌱":ps.cur<=14?"A solid habit forming 🌟":ps.cur<=29?"Two weeks strong 🔥":"This is who you are now 🎵";return`<div class="grid"><section class="panel"><h2>🔥 Current streak: ${ps.cur} days | ⭐ Total practiced: ${done} days | 📅 Days remaining: ${summerStats().remain}</h2><p class="muted">${msg}</p>${[7,14,30,50].includes(ps.cur)&&state.piano.milestone!==ps.cur?`<p class="pill gold">🎉 ${ps.cur}-day streak! Amazing!</p>`:""}</section>${[["June 2026","2026-06-01","2026-06-30"],["July 2026","2026-07-01","2026-07-31"],["August 2026","2026-08-01","2026-08-31"],["September 2026","2026-09-01","2026-09-30"]].map(m=>month(m)).join("")}</div>`}
function month(m){let ds=range(m[1],m[2]),pad=(date(m[1]).getDay()+6)%7;return`<section class="panel practice-month"><h3>${m[0]}</h3><div class="calendar">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")}${Array.from({length:pad},()=>`<div></div>`).join("")}${ds.map(d=>{let valid=d>=START&&d<=END;return`<div class="day ${state.piano.days[d]?"done":""} ${d===today()?"today":""} ${valid?"":"off"}" ${valid?`data-act="togglePractice" data-d="${d}"`:""}><span class="n">${+d.slice(8)}</span><span>${state.piano.days[d]?seedEmoji(d):""}</span></div>`}).join("")}</div></section>`}
function composition(){return`<div class="grid"><button class="btn" data-act="addPiece">+ Add New Piece</button>${state.composition.pieces.map((p,i)=>{let pc=pct(p.tasks.filter(t=>t.done).length,p.tasks.length);return`<article class="card"><div class="form"><div class="field"><label>Title</label>${input(`composition.pieces.${i}.title`,p.title)}</div><div class="field"><label>Instrumentation</label>${input(`composition.pieces.${i}.inst`,p.inst)}</div></div><p class="muted">${esc(p.goal)}</p><button class="btn" data-act="cyclePiece" data-i="${i}">${["Sketching","Drafting","Revising","Ready for Recording","Complete"][p.status]}</button><div class="field"><label>Target date</label>${input(`composition.pieces.${i}.target`,p.target,"date")}</div>${bar(pc)}<div class="grid">${p.tasks.map((t,j)=>`<div class="row"><label class="check"><input type="checkbox" data-path="composition.pieces.${i}.tasks.${j}.done" ${t.done?"checked":""}><span class="box"></span><input style="${t.done?"text-decoration:line-through;opacity:.55":""}" data-path="composition.pieces.${i}.tasks.${j}.text" value="${esc(t.text)}"></label><button class="btn danger" data-act="delTask" data-i="${i}" data-j="${j}">×</button></div>`).join("")}</div><button class="btn" data-act="addTask" data-i="${i}">＋ Add task</button><details><summary>Notes & ideas</summary>${ta(`composition.pieces.${i}.notes`,p.notes)}</details><button class="btn danger" data-act="delPiece" data-i="${i}">Delete piece</button></article>`}).join("")}</div>`}
function composer(){let all=state.composer.sections.flatMap(s=>s.works),y=state.composer.sections[0].works.filter(w=>w.status===4).length,t=state.composer.sections[1].works.filter(w=>w.status===4).length;return`<div class="grid"><section class="panel"><h2>Works analyzed: ${all.filter(w=>w.status===4).length} / 13</h2><p>Yoshimatsu ${y}/5</p>${bar(pct(y,5))}<p>Takemitsu ${t}/8</p>${bar(pct(t,8))}</section>${state.composer.sections.map((s,si)=>`<section class="panel"><div class="row"><h2>${s.name}</h2><button class="btn" data-act="toggleComposer" data-i="${si}">${s.collapsed?"Open":"Collapse"}</button></div><div class="${s.collapsed?"hidden":""} grid">${s.works.map((w,wi)=>`<article class="card"><div class="row"><h3>${esc(w.title)}</h3><span class="pill ${s.accent==="teal"?"ok":"gold"}">${s.name.split(" ")[0]}</span></div><div class="checks">${w.tags.map((tag,ti)=>`<span class="pill">${esc(tag)} <button class="btn" data-act="delTag" data-i="${si}" data-j="${wi}" data-k="${ti}">×</button></span>`).join("")}</div><div class="row"><input placeholder="add tag" data-temp-tag="${si}.${wi}"><button class="btn" data-act="addTag" data-i="${si}" data-j="${wi}">Add tag</button></div><button class="btn" data-act="cycleWork" data-i="${si}" data-j="${wi}">${["○ Not Started","👂 Listening","🔍 Analyzing","📝 Notes Written","✅ Complete"][w.status]}</button><p class="muted">Date completed: ${w.doneDate||"—"}</p><details><summary>Analysis notes, observations, ideas to steal</summary>${ta(`composer.sections.${si}.works.${wi}.notes`,w.notes)}</details></article>`).join("")}<button class="btn" data-act="addWork" data-i="${si}">+ Add Work</button></div></section>`).join("")}</div>`}
function future(){let total=state.future.weekHours.reduce((s,w)=>s+(+w.hours||0),0);return`<div class="grid"><section class="panel"><details open><summary><h2>🗺️ Career Exploration</h2></summary>${ta("future.careerText",state.future.careerText,"Music industry, other fields, things to look into")}<div class="grid">${state.future.career.map((c,i)=>`<div class="row">${input(`future.career.${i}.text`,c.text)}${cb(`future.career.${i}.done`,"explored",c.done)}</div>`).join("")}</div><button class="btn" data-act="addCareer">+ Add item</button></details></section><section class="panel"><h2>🕐 Workday — Weekly Hours Log</h2><table class="table"><thead><tr><th>Week</th><th>Period</th><th>Hours</th><th>Notes</th></tr></thead><tbody>${state.future.weekHours.map((w,i)=>`<tr class="${currentWeekPeriod(w.period)?"current-week":""}"><td>${w.week}</td><td class="date">${w.period}</td><td>${input(`future.weekHours.${i}.hours`,w.hours,"number")}</td><td>${input(`future.weekHours.${i}.notes`,w.notes)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="4">Total hours logged: <b class="num">${total}</b></td></tr></tfoot></table></section><section class="panel"><h2>🔬 Research — VR & Amblyopia</h2><button class="btn" data-act="cycleResearch">${["Not Started","Background Reading","Actively Researching","Writing Up"][state.future.research.status]}</button><div class="checks">${["Read background literature on amblyopia treatment","Review VR therapy research","Explore self-treatment approaches","Talk to relevant people / consult professionals"].map((l,i)=>cb(`future.research.checks.${i}`,l,state.future.research.checks[i])).join("")}</div>${ta("future.research.notes",state.future.research.notes,"Notes/links")}</section><section class="panel"><h2>🎙️ Blog / Podcast (?)</h2><button class="btn" data-act="cycleBlog">${["Just an idea","Planning","In Progress"][state.future.blog.status]}</button><div class="checks">${["Written blog","Audio podcast","Video","Undecided"].map((l,i)=>cb(`future.blog.formats.${i}`,l,state.future.blog.formats[i])).join("")}</div><div class="grid">${state.future.blog.ideas.map((it,i)=>`<div class="row">${cb(`future.blog.ideas.${i}.done`,"",it.done)}${input(`future.blog.ideas.${i}.text`,it.text)}<button class="btn danger" data-act="delIdea" data-i="${i}">×</button></div>`).join("")}</div><button class="btn" data-act="addIdea">+ Add idea</button>${ta("future.blog.notes",state.future.blog.notes,"Notes")}</section><section class="panel"><h2>📓 Open Notes</h2>${ta("future.openNotes",state.future.openNotes,"Ideas, reminders, random thoughts — anything that doesn't fit elsewhere")}<p class="muted" style="text-align:right">${state.future.openNotes.length} characters</p></section></div>`}
function currentWeekDate(d){return currentWeekPeriod(`${d.slice(5)}–${d.slice(5)}`)}
function currentWeekPeriod(p){let [a,b]=p.split("–"),y="2026-",s=y+a,e=y+b,t=today();return t>=s&&t<=e}
document.addEventListener("click",e=>{let tab=e.target.closest("[data-tab]");if(tab){active=tab.dataset.tab;save(false);render();return}let a=e.target.closest("[data-act]");if(!a)return;let act=a.dataset.act;
if(act==="cycleStage"){let t=state.ep.tracks[a.dataset.i];t.stages[a.dataset.j]=(t.stages[a.dataset.j]+1)%3}
if(act==="toggleTrack")state.ep.tracks[a.dataset.i].collapsed=!state.ep.tracks[a.dataset.i].collapsed;
if(act==="addBook")state.reading.books.push({id:id(),title:"",author:"",color:"amber",status:0,pages:0,total:"",manual:0,start:"",end:"",notes:""});
if(act==="delBook"&&confirm("Delete this book?"))state.reading.books.splice(a.dataset.i,1);
if(act==="cycleBook"){let b=state.reading.books[a.dataset.i];b.status=(b.status+1)%3;if(b.status===1&&!b.start)b.start=today();if(b.status===2)b.end=today()}
if(act==="toggleTodayLog"){state.reading.logs[today()]??={text:"",books:{}};state.reading.logs[today()].open=!state.reading.logs[today()].open}
if(act==="expandLog")state.reading.logs[a.dataset.d].expanded=!state.reading.logs[a.dataset.d].expanded;
if(act==="saveWorkToday"){state.work.entries[today()]??={};state.work.entries[today()].saved=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
if(act==="editWork"){state.work.entries[today()]={...state.work.entries[a.dataset.d]};active="work"}
if(act==="cycleAssign"){let x=state.orch.assignments[a.dataset.i];x.status=(x.status+1)%3}
if(act==="togglePractice"){let d=a.dataset.d;state.piano.days[d]=!state.piano.days[d];let ps=streak(state.piano.days);if([7,14,30,50].includes(ps.cur))state.piano.milestone=0}
if(act==="addPiece")state.composition.pieces.push({id:id(),title:"New piece",inst:"",goal:"",status:0,target:"",notes:"",tasks:[]});
if(act==="cyclePiece"){let p=state.composition.pieces[a.dataset.i];p.status=(p.status+1)%5}
if(act==="addTask")state.composition.pieces[a.dataset.i].tasks.push({id:id(),text:"",done:false});
if(act==="delTask")state.composition.pieces[a.dataset.i].tasks.splice(a.dataset.j,1);
if(act==="delPiece"&&confirm("Delete this piece?"))state.composition.pieces.splice(a.dataset.i,1);
if(act==="toggleComposer")state.composer.sections[a.dataset.i].collapsed=!state.composer.sections[a.dataset.i].collapsed;
if(act==="cycleWork"){let w=state.composer.sections[a.dataset.i].works[a.dataset.j];w.status=(w.status+1)%5;if(w.status===4)w.doneDate=today()}
if(act==="addTag"){let inp=document.querySelector(`[data-temp-tag="${a.dataset.i}.${a.dataset.j}"]`);if(inp.value.trim())state.composer.sections[a.dataset.i].works[a.dataset.j].tags.push(inp.value.trim())}
if(act==="delTag")state.composer.sections[a.dataset.i].works[a.dataset.j].tags.splice(a.dataset.k,1);
if(act==="addWork")state.composer.sections[a.dataset.i].works.push({id:id(),title:"New work",tags:[],status:0,doneDate:"",notes:""});
if(act==="addCareer")state.future.career.push({id:id(),text:"",done:false});
if(act==="cycleResearch")state.future.research.status=(state.future.research.status+1)%4;
if(act==="cycleBlog")state.future.blog.status=(state.future.blog.status+1)%3;
if(act==="addIdea")state.future.blog.ideas.push({id:id(),text:"",done:false});
if(act==="delIdea")state.future.blog.ideas.splice(a.dataset.i,1);
if(act==="togglePractice"&&state.piano.days[a.dataset.d])celebrate(e.clientX,e.clientY);
save();render()});
document.addEventListener("input",e=>{let p=e.target.dataset.path;if(!p)return;ensurePath(p);set(p,e.target.type==="number"?e.target.value:e.target.value);debounced()});
document.addEventListener("change",e=>{let p=e.target.dataset.path;if(!p)return;ensurePath(p);set(p,e.target.type==="checkbox"?e.target.checked:e.target.value);if(p.includes(".clock")&&e.target.checked)celebrate(e.clientX,e.clientY);save();render()});
function ensurePath(path){let a=path.split("."),o=state;for(let i=0;i<a.length-1;i++){if(o[a[i]]==null)o[a[i]]={};o=o[a[i]]}}
function celebrate(x=innerWidth/2,y=innerHeight/2){["🎉","✨","🌟"].forEach((m,i)=>{let s=document.createElement("span");s.className="burst";s.textContent=m;s.style.left=x+i*18+"px";s.style.top=y+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),950)})}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&/^[1-9]$/.test(e.key)){active=tabs[+e.key-1][0];save(false);render()}});
$("exportBtn").onclick=()=>{let b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="summer2026_data.json";a.click();URL.revokeObjectURL(u)};
$("importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.ep||!x.reading||!x.future)throw Error("Invalid data shape");state=x;save();render()}catch(err){alert("Import failed: "+err.message)}};r.readAsText(f)};
$("resetBtn").onclick=()=>{if(confirm("Reset all saved data to seed data?")&&confirm("This cannot be undone. Reset?")){state=defaultState();save();render()}};
load();render();
</script>
